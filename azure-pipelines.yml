trigger:
  branches: { include: [ master, uat ] }
pr:
  branches: { include: [ master ] }

stages:
# ---------- BUILD ----------
- stage: Build
  jobs:
  - job: Build
    pool: { name: Default }              # your agent pool
    variables:
      NODE_VERSION: '20.x'
      NPM_CACHE_DIR: '$(Pipeline.Workspace)/.npm'
    steps:
    - checkout: self
      fetchDepth: 0
    - task: NodeTool@0
      inputs: { versionSpec: '$(NODE_VERSION)' }
      displayName: Use Node $(NODE_VERSION)
    - script: npm config set cache "$(NPM_CACHE_DIR)"
      displayName: Configure npm cache
    - task: Cache@2
      displayName: Restore npm cache
      inputs:
        key: 'npm | "$(Agent.OS)" | package-lock.json'
        restoreKeys: |
          npm | "$(Agent.OS)"
          npm
        path: '$(NPM_CACHE_DIR)'
    - script: |
        if [ -f package-lock.json ]; then npm ci; else npm i; fi
      displayName: Install deps
    - script: npm run lint --if-present
      displayName: Lint
    - script: |
        npm run build
        rm -rf dist && mkdir -p dist/.next
        # Flatten standalone layout into dist/
        cp -r .next/standalone/* dist/
        mkdir -p dist/.next/static
        cp -r .next/static/* dist/.next/static/
        [ -d public ] && cp -r public dist/public || true
      displayName: Build & assemble standalone server
    - script: |
        tar -C dist -czf dist.tar.gz .
      displayName: Pack artifact
    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: dist.tar.gz
        artifact: app
      displayName: Publish artifact "app"

# ---------- DEPLOY UAT (auto on branch uat) ----------
- stage: Deploy_UAT
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/uat'))
  jobs:
  - deployment: ToUAT
    environment: 'uat'                     # create Environment "uat" in DevOps
    strategy:
      runOnce:
        deploy:
          steps:
          - task: DownloadPipelineArtifact@2
            inputs:
              artifact: app
              path: '$(Pipeline.Workspace)'
          - script: |
              set -e
              mkdir -p deploy && tar -xzf $(Pipeline.Workspace)/dist.tar.gz -C deploy
              REL=/srv/portfolio-uat/releases/$(Build.BuildId)
              sudo mkdir -p "$REL"
              sudo rsync -a deploy/ "$REL"/
              sudo ln -sfn "$REL" /srv/portfolio-uat/current
              sudo systemctl restart portfolio-uat
              # keep last 5 releases
              sudo bash -lc 'cd /srv/portfolio-uat/releases && ls -1t | tail -n +6 | xargs -r rm -rf'
            displayName: Deploy to UAT (local server)

# ---------- DEPLOY PROD (approval) ----------
- stage: Deploy_PROD
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
  jobs:
  - deployment: ToPROD
    environment: 'prod'                    # add approval on this Environment in DevOps
    strategy:
      runOnce:
        deploy:
          steps:
          - task: DownloadPipelineArtifact@2
            inputs:
              artifact: app
              path: '$(Pipeline.Workspace)'
          - script: |
              set -e
              mkdir -p deploy && tar -xzf $(Pipeline.Workspace)/dist.tar.gz -C deploy
              REL=/srv/portfolio-prod/releases/$(Build.BuildId)
              sudo mkdir -p "$REL"
              sudo rsync -a deploy/ "$REL"/
              sudo ln -sfn "$REL" /srv/portfolio-prod/current
              sudo systemctl restart portfolio-prod
              sudo bash -lc 'cd /srv/portfolio-prod/releases && ls -1t | tail -n +6 | xargs -r rm -rf'
            displayName: Deploy to PROD (local server)
